name: V1.4 alerter

on:
  workflow_dispatch: {}
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: v14-alerter
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest saved state
        run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check markets and send alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node alerter.js
      - name: Save state
        run: |
          git config user.name "v14-alerter"
          git config user.email "v14-alerter@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "alerter state" -q
          for i in 1 2 3; do git push -q && exit 0; git pull --rebase -q origin "${GITHUB_REF_NAME}"; done
